# splat config for WWF No Mercy (USA, Rev 1) — recon 2026-07-14 (tools/nm_recon*.py):
#   - entry stub (rom 0x1000): clears bss 0x80056670 +0x672F0 (to 0x800BD960),
#     sp 0x8009FDE0, jumps to game_main 0x80000460 (= rom 0x1060, SAME VRAM AS WM2000)
#   - fixed-segment code ends 0x40F74 (last jr $ra 0x40F6C); rspboot text begins
#     0x40F80; audio ucode text at 0x41050 +0xC54 — BYTE-IDENTICAL to Revenge/WM2000's
#     newer-AKI revision (dispatch table at 0x55920, bit-identical to WM2000's) — see
#     rsp/nomercy_audio.toml. Gfx ucode follows the audio text (zeros then text at
#     ~0x41CB0); NOT byte-identical to WM2000's (revision drift, 199/256 blocks match)
#     — RT64's GBI database must match it at boot; watch for an unknown-ucode failure.
#   - overlay descriptor table at rom 0x539A0 (five 9-word entries, zero-terminated):
#     FIVE overlays across TWO vram swap slots — one more overlay than WM2000, same
#     architecture. Bounds below are byte-exact from the descriptors.
#     Slot 0x800D9960: ovl_a + ovl_e; slot 0x80106760: ovl_b/ovl_c/ovl_d.
#     ovl_a's bss ends exactly at 0x80106760 (a+{b,c,d} coexist, WM2000's scheme);
#     ovl_e is the big standalone image spanning both slots (WM2000's ovl_d analog).
name: WWF No Mercy (USA) (Rev 1)
sha1: 91cee3d096f4a76644d8b35b9aead6448909abd1
options:
  basename: nomercy
  target_path: nomercy.z64
  elf_path: build/nomercy.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm
  data_path: asm/data
  ld_script_path: nomercy.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  libultra_symbols: True
  hardware_regs: True

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    subsegments:
      - [0x1050, asm]
      # 0x3D800-0x3DC00 is a low-instruction-validity window (nm_recon2) — kept as
      # asm ON PURPOSE: junk data decoding as never-executed functions is safe, but
      # real IDO cold-path fragments mapped as data recompile EMPTY and leak stack
      # (WM2000's 0x3A1D8 disaster). Revisit only with evidence.
      - [0x40F80, data]

  # Swap slot 0x800D9960: ovl_a and ovl_e (ovl_e also overlaps slot 0x80106760 —
  # it is the big standalone image, WM2000's ovl_d analog).
  - name: ovl_a
    type: code
    start: 0x57310
    vram: 0x800D9960
    exclusive_ram_id: ovl_d9960
    bss_size: 0x2F00
    subsegments:
      - [0x57310, asm]
      - [0x702F0, data]
      - { type: bss, vram: 0x80103860 }

  # Swap slot 0x80106760: ovl_b, ovl_c, ovl_d; each can sit alongside ovl_a
  # (ovl_a's bss ends exactly at 0x80106760).
  - name: ovl_b
    type: code
    start: 0x81210
    vram: 0x80106760
    exclusive_ram_id: ovl_106760
    bss_size: 0x394F0
    subsegments:
      - [0x81210, asm]
      - [0x99680, data]
      - { type: bss, vram: 0x801338E0 }

  - name: ovl_c
    type: code
    start: 0xAE390
    vram: 0x80106760
    exclusive_ram_id: ovl_106760
    bss_size: 0x63E0
    subsegments:
      - [0xAE390, asm]
      - [0xEFB10, data]
      - { type: bss, vram: 0x80155620 }

  - name: ovl_d
    type: code
    start: 0xFD250
    vram: 0x80106760
    exclusive_ram_id: ovl_106760
    bss_size: 0x1F940
    subsegments:
      - [0xFD250, asm]
      - [0x13DBA0, data]
      - { type: bss, vram: 0x8014E0F0 }

  - name: ovl_e
    type: code
    start: 0x144BE0
    vram: 0x800D9960
    exclusive_ram_id: ovl_d9960
    bss_size: 0x19B20
    subsegments:
      - [0x144BE0, asm]
      - [0x1AF8F0, data]
      - { type: bss, vram: 0x80151ED0 }

  - name: assets
    type: bin
    start: 0x1BD150

  - [0x2000000]  # ROM size confirmed: 32 MB exactly (same as WM2000)
