# N64Recomp config for WWF No Mercy (USA, Rev 1). Adapted from WM2000's wm2k.toml
# (which came from Revenge's, which came from World Tour's wcw.toml). No Mercy is
# WM2000's direct sequel (same AKI team, one year apart) — expect WM2000's
# architecture: entrypoint 0x80000400, fixed segment rom 0x1000 <-> vram 0x80000400,
# multiple overlays across shared vram swap slots (9-word descriptor table in
# fixed-segment data). Symbol-TOML mode.

[input]
entrypoint = 0x80000400
rom_file_path = "nomercy.z64"
bss_section_suffix = "_bss"
symbols_file_path = "syms/dump.toml"
output_func_path = "RecompiledFuncs"
trace_mode = false

[patches]
# Functions containing cop0/cache/eret/tlb opcodes are stubbed (syms/
# stub_candidates.txt, regenerated by tools/gen_stubs.py which rewrites this block —
# do NOT put comments inside it). Classify each against WM2000's verified stub set
# (its CLAUDE.md session 8 part 2: all 18 verified correct as no-ops; reverse-
# fingerprint each onto the function WM2000 also stubs). WM2000's lesson stands:
# NEVER stub osGetCount — it freezes the game clock and timed waits never complete.
stubs = [
]

ignored = [
]

# Idle-thread cooperative-yield fix: NOT yet applied. Every sister needed it (WT/
# Revenge/WM2000/VPW64): after launching all threads the idle thread parks in a
# backward-j busy spin that never yields under ultramodern's cooperative scheduler
# (symptom: WCW_HEALTH_LOG ext backlog grows, del/s=0, vis/s=0). Find the spin during
# bring-up (WM2000's was `jal func_80031280; j 0x800005A4` in func_800004D0) and
# rewrite the backward j into `b .` (0x1000FFFF) so N64Recomp emits pause_self():
#
# [[patches.instruction]]
# func = "func_XXXXXXXX"
# vram = 0xXXXXXXXX
# value = 0x1000FFFF
