# RSPRecomp config for No Mercy's AUDIO microcode — CONFIRMED by recon 2026-07-14
# (tools/nm_recon.py / nm_recon2.py): the ucode text at ROM 0x41050 is BYTE-IDENTICAL
# (full 0xC54) to Revenge/WM2000's newer-AKI audio revision (WM2000 had it at 0x39510,
# Revenge at 0x2C910), and the dispatch table (found at ROM 0x55920 in the ucode data)
# is bit-identical too — so the indirect-branch target set below transfers verbatim,
# including the 12-bit-PC jump-table gotcha (entry 14 stored 0x02B0 = recompiler
# 0x12B0; see Revenge's rsp/README.md).
# text_address 0x04001080 = where rspboot places task ucode in IMEM.
# Run from repo root:  .\RSPRecomp.exe rsp\nomercy_audio.toml  (paths relative to rsp/).
text_offset = 0x41050
text_size = 0xC54
text_address = 0x04001080
rom_file_path = "../nomercy.z64"
output_file_path = "nomercy_audio.cpp"
output_function_name = "nomercy_audio_ucode"

extra_indirect_branch_targets = [
	0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208,
	0x127C, 0x1348, 0x1248, 0x1C84, 0x12D4, 0x12B0, 0x1384
]
